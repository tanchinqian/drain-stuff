<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="590" viewBox="0 0 1180 590" role="img" aria-labelledby="title"><title id="title">Node wiring and power rails — design, not fabricated</title><rect width="1180" height="590" fill="#e9e4d8"/><g fill="#2f2b26" font-family="Arial,sans-serif"><text x="28" y="38" font-size="24">Node wiring and power rails</text><text x="28" y="65" font-size="14">Design-level, bench test pending · dimensions and components are proposed</text><rect x="28" y="110" width="190" height="75" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="42" y="138" font-size="16">Protected LiFePO4</text><text x="42" y="160" font-size="13">3.2 V nominal assumption</text><path d="M218 147L285 147" fill="none" stroke="#2f2b26" /><rect x="285" y="110" width="190" height="75" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="299" y="138" font-size="16">Buck/boost 3.3 V</text><text x="299" y="160" font-size="13">MCU + radio</text><path d="M475 147L550 147" fill="none" stroke="#2f2b26" /><rect x="550" y="105" width="260" height="150" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="564" y="133" font-size="16">ESP32 reference pins</text><text x="564" y="155" font-size="13">17 trigger · 16 echo · 27 float</text><text x="564" y="184" font-size="13">25 switch · 34 soil · 35 battery</text><text x="564" y="211" font-size="13">SPI 18/19/23/5 · 14 RST · 26/33 DIO0/1</text><rect x="895" y="110" width="245" height="75" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="909" y="138" font-size="16">SX1276 radio</text><text x="909" y="160" font-size="13">3.3 V · antenna plan unverified</text><path d="M810 147L895 147" fill="none" stroke="#2f2b26" /><path d="M120 185L120 320" fill="none" stroke="#2f2b26" /><rect x="28" y="320" width="190" height="80" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="42" y="348" font-size="16">5 V boost</text><text x="42" y="370" font-size="13">Supply for ultrasonic</text><path d="M218 360L285 360" fill="none" stroke="#2f2b26" /><rect x="285" y="315" width="240" height="110" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="299" y="343" font-size="16">PMOS high-side switch</text><text x="299" y="365" font-size="13">S=5 V · D=sensor rail</text><text x="299" y="391" font-size="13">100k gate→source · NPN sink</text><text x="299" y="411" font-size="12">GPIO25→10k→base; 100k pull-down</text><path d="M525 360L600 360" fill="none" stroke="#2f2b26" /><rect x="600" y="320" width="210" height="80" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="614" y="348" font-size="16">Ultrasonic module</text><text x="614" y="370" font-size="13">Trigger / echo / GND</text><path d="M705 320L705 255" fill="none" stroke="#2f2b26" /><rect x="895" y="290" width="245" height="80" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="909" y="318" font-size="16">Float → GPIO27</text><text x="909" y="340" font-size="13">10k pullup 3.3 V; switch→GND</text><text x="28" y="485" font-size="15">Echo divider: 5 V → 12k → GPIO16 → 18k → GND (~3.0 V). Never connect a 5 V echo directly.</text><text x="28" y="516" font-size="15">Battery divider: battery → 330k → GPIO35 → 100k → GND; 100 nF at ADC. Optional soil probe → GPIO34.</text><text x="28" y="547" font-size="15">All grounds common. PMOS gate drive uses an NPN level shift. See SCHEMATIC.md for the complete pin netlist.</text></g></svg>