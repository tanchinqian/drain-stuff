<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460" role="img" aria-labelledby="title"><title id="title">Drain node system — design, not fabricated</title><rect width="1180" height="460" fill="#e9e4d8"/><g fill="#2f2b26" font-family="Arial,sans-serif"><text x="28" y="38" font-size="24">Drain node system</text><text x="28" y="65" font-size="14">Design-level, bench test pending · dimensions and components are proposed</text><rect x="28" y="140" width="174" height="85" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="42" y="168" font-size="16">Ultrasonic + float</text><text x="42" y="190" font-size="13">Distance / crest</text><path d="M202 182L216 182" fill="none" stroke="#2f2b26" stroke-width="2"/><rect x="218" y="140" width="174" height="85" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="232" y="168" font-size="16">ESP32 + SX1276</text><text x="232" y="190" font-size="13">12-byte payload</text><path d="M392 182L406 182" fill="none" stroke="#2f2b26" stroke-width="2"/><rect x="408" y="140" width="174" height="85" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="422" y="168" font-size="16">LoRaWAN gateway</text><text x="422" y="190" font-size="13">Township / operator</text><path d="M582 182L596 182" fill="none" stroke="#2f2b26" stroke-width="2"/><rect x="598" y="140" width="174" height="85" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="612" y="168" font-size="16">Network server</text><text x="612" y="190" font-size="13">TTN / ChirpStack</text><path d="M772 182L786 182" fill="none" stroke="#2f2b26" stroke-width="2"/><rect x="788" y="140" width="174" height="85" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="802" y="168" font-size="16">Authenticated ingest</text><text x="802" y="190" font-size="13">Decode, trust, dedupe</text><path d="M962 182L976 182" fill="none" stroke="#2f2b26" stroke-width="2"/><rect x="978" y="140" width="174" height="85" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="992" y="168" font-size="16">SQLite + board</text><text x="992" y="190" font-size="13">Detected only</text><rect x="218" y="290" width="174" height="72" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="232" y="318" font-size="16">Battery + rails</text><text x="232" y="340" font-size="13">3.3 V and switched 5 V</text><path d="M305 290L305 225" fill="none" stroke="#2f2b26" /><text x="28" y="410" font-size="16">Independent network and simulator secrets fix reading provenance; an uplink never confirms or assigns a fault.</text></g></svg>