<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="550" viewBox="0 0 1180 550" role="img" aria-labelledby="title"><title id="title">Chamber mounting section — design, not fabricated</title><rect width="1180" height="550" fill="#e9e4d8"/><g fill="#2f2b26" font-family="Arial,sans-serif"><text x="28" y="38" font-size="24">Chamber mounting section</text><text x="28" y="65" font-size="14">Design-level, bench test pending · dimensions and components are proposed</text><rect x="120" y="160" width="550" height="300" fill="none" stroke="#2f2b26" stroke-width="3"/><path d="M100 160L720 160" fill="none" stroke="#2f2b26" stroke-width="5"/><rect x="335" y="90" width="150" height="48" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="349" y="118" font-size="16">Cover bracket</text><rect x="390" y="148" width="40" height="30" fill="#2f2b26"/><path d="M410 178L410 393" fill="none" stroke="#2f2b26" stroke-dasharray="6 5"/><rect x="125" y="300" width="540" height="155" fill="#a7c8bf"/><path d="M125 300L665 300" fill="none" stroke="#2f2b26" stroke-width="2"/><text x="735" y="305" font-size="16">Maximum measured / crest level</text><path d="M665 300L725 300" fill="none" stroke="#2f2b26" /><text x="735" y="235" font-size="16">Blind zone: ≥0.3 m clear distance</text><path d="M432 179L700 225" fill="none" stroke="#2f2b26" /><circle cx="650" cy="300" r="12" fill="#f2eee4" stroke="#2f2b26"/><text x="735" y="350" font-size="16">Independent float at crest</text><path d="M662 300L724 343" fill="none" stroke="#2f2b26" /><path d="M80 178L80 455" fill="none" stroke="#2f2b26" stroke-width="2"/><path d="M65 178L95 178" fill="none" stroke="#2f2b26" /><path d="M65 455L95 455" fill="none" stroke="#2f2b26" /><text x="28" y="500" font-size="16">Mounting height is measured from sensor face to local depth datum. Drawing is schematic, not to scale.</text><rect x="760" y="95" width="340" height="75" rx="4" fill="#f2eee4" stroke="#cfc7b4"/><text x="774" y="123" font-size="16">Electronics and cable glands</text><text x="774" y="145" font-size="13">Above maximum water; bracket route</text><path d="M485 115L760 115" fill="none" stroke="#2f2b26" /><text x="735" y="403" font-size="16">Depth = mount − distance + offset</text><text x="735" y="433" font-size="16">Install from above; no chamber entry</text></g></svg>